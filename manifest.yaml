manifestVersion: 1
name: "@kneel/babybuddy"
version: "2026.10.03.1"
description: "Read and write Baby Buddy baby-tracking data (feedings, diapers, sleep, pumping, weight, and more) with paginated sync, and generate a suite of analysis reports — a consolidated daily summary plus sleep (totals, longest stretch, feeding correlation, regression watch), feeding, diaper, pumping, temperature, tummy-time, medication, and weight-trend reports."

repository: https://github.com/NeilHanlon/swamp-babybuddy

additionalFiles:
  - README.md
  - LICENSE.txt

models:
  - babybuddy.ts

reports:
  - daily_summary.ts
  - sleep_feeding_correlation.ts
  - sleep_longest_stretch.ts
  - sleep_regression_watch.ts
  - sleep_totals.ts
  - weight_feeding_correlation.ts
  - feeding_amounts.ts
  - feeding_duration.ts
  - feeding_intervals.ts
  - diaper_intervals.ts
  - diaper_types.ts
  - pumping_amounts.ts
  - temperature.ts
  - tummy_time.ts
  - medication.ts
  - weight_trend.ts

# Pure network/JS extension — runs anywhere. Empty = universal.
platforms: []
